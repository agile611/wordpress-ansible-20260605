#Base de datos database
network_prefix: "10.11.12"

db_name: "wordpress"
db_user: "wordpress"
db_password: "wordpress"
db_host: "{{ network_prefix }}.20"
db_root_password: "root"
mysql_bind_address: "0.0.0.0"
mysql_port_number: 3306
  
packages_database:
  - default-mysql-server
  - python3-mysqldb
  - python3-pymysql


#Servidor web webserver
packages_apache2: 
  - apache2
  - libapache2-mod-php

packages_php:
  - php
  - php-cli
  - php-fpm
  - php-mysql
  - php-xml
  - php-curl
  - php-mbstring
  - php-zip

packages_wordpress:
  - unzip
  - wget
  - curl

wordpress_version: "6.9.4" # Última versión de WordPress al momento de escribir esta respuesta, para poner la 7.0
wordpress_download_url: "https://wordpress.org/wordpress-{{ wordpress_version }}.zip"
wordpress_unzip_dir: "/var/www/html/"
wordpress_install_dir: "/var/www/html/wordpress"
wp_admin_user: "admin"
wp_admin_password: "admin"
wp_admin_email: "admin@admin.com"
wordpress_url: "http://{{ network_prefix }}.40/"